name: Setup environment
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
